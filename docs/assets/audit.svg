<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="auBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="auAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="auGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes auVerdict {
      0%, 38% { fill: #7f1d1d; stroke: #ef4444; }
      44%, 100% { fill: #064e3b; stroke: #22c55e; }
    }
    @keyframes auVerdictText {
      0%, 38% { opacity: 1; } 39%, 43% { opacity: 0; } 44%, 100% { opacity: 1; }
    }
    @keyframes auLoop {
      0% { offset-distance: 0%; opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes auRound {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #a855f7); }
    }
    .verdict { animation: auVerdict 9s ease-in-out infinite; }
    .verdict-text { animation: auVerdictText 9s ease-in-out infinite; }
    .loop-dot {
      offset-path: path("M 560 150 C 640 150, 660 240, 600 260 C 540 280, 480 260, 470 220");
      animation: auLoop 9s linear infinite;
    }
    .loop-dot-2 {
      offset-path: path("M 560 150 C 640 150, 660 240, 600 260 C 540 280, 480 260, 470 220");
      animation: auLoop 9s linear infinite 3s;
    }
    .round { animation: auRound 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .verdict, .verdict-text, .loop-dot, .loop-dot-2, .round { animation: none !important; }
    }
  </style>

  <rect width="960" height="430" rx="14" fill="url(#auBg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="40" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" letter-spacing="1">
    PEER AUDIT: THE BOUNDED REVISE LOOP
  </text>
  <text x="40" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    A runner-up model checks the real files — never the report alone — with at most two revisions
  </text>

  <!-- wires -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M 210 170 L 270 170"/>
    <path d="M 560 150 C 640 150, 660 240, 600 260 C 540 280, 480 260, 470 220" stroke-dasharray="5 4"/>
    <path d="M 660 170 L 710 170"/>
    <path d="M 710 170 C 740 170, 740 300, 770 300"/>
    <path d="M 710 170 C 740 170, 740 360, 770 360"/>
  </g>

  <!-- PRIMARY -->
  <g transform="translate(90, 140)">
    <rect width="120" height="60" rx="9" fill="#082f49" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="60" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle">PRIMARY</text>
    <text x="60" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">does the task</text>
  </g>

  <!-- AUDITOR -->
  <g transform="translate(270, 130)" filter="url(#auGlow)">
    <rect width="170" height="80" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="85" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e9d5ff" text-anchor="middle">RUNNER-UP</text>
    <text x="85" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" text-anchor="middle">inspects the worktree</text>
    <text x="85" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#a855f7" text-anchor="middle">Stats picks it · first verdict counts</text>
  </g>

  <!-- VERDICT (animated FAIL -> PASS) -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="140" height="52" rx="9" class="verdict" stroke-width="1.6"/>
    <text x="70" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff" class="verdict-text" text-anchor="middle">VERDICT: FAIL →</text>
    <text x="70" y="38" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff" class="verdict-text" text-anchor="middle">issues list</text>
  </g>

  <!-- ROUNDS -->
  <g transform="translate(470, 210)">
    <rect x="0" y="0" width="140" height="40" rx="9" fill="#0c0a1f" stroke="#4b5563" stroke-width="1.2" class="round"/>
    <text x="70" y="17" font-family="ui-monospace, monospace" font-size="10" fill="#d1d5db" text-anchor="middle">revise ×2 max</text>
    <text x="70" y="31" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af" text-anchor="middle">then it is decided</text>
  </g>

  <circle class="loop-dot" r="5" fill="#a855f7" filter="url(#auGlow)"/>
  <circle class="loop-dot-2" r="4" fill="#38bdf8" filter="url(#auGlow)"/>

  <!-- OUTCOMES -->
  <g transform="translate(710, 140)">
    <rect width="200" height="60" rx="9" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="100" y="25" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#bbf7d0" text-anchor="middle">pass · fixed</text>
    <text x="100" y="41" font-family="ui-monospace, monospace" font-size="9.5" fill="#86efac" text-anchor="middle">approved, 1st try or after revise</text>
  </g>
  <g transform="translate(710, 280)">
    <rect width="200" height="80" rx="9" fill="#1c1408" stroke="url(#auAmber)" stroke-width="1.6"/>
    <text x="100" y="24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">disputed</text>
    <text x="100" y="40" font-family="ui-monospace, monospace" font-size="9.5" fill="#fbbf24" text-anchor="middle">gate: true → fail, dependents skipped</text>
    <text x="100" y="55" font-family="ui-monospace, monospace" font-size="9.5" fill="#fdba74" text-anchor="middle">else → ESCALATION, both sides shown</text>
  </g>
  <g transform="translate(710, 372)">
    <rect width="200" height="30" rx="9" fill="#0b1220" stroke="#334155" stroke-width="1.2"/>
    <text x="100" y="19" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8" text-anchor="middle">no verdict line counts as FAIL</text>
  </g>
</svg>
