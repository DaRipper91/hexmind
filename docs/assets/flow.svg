<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="gb"/>
      <feComposite in="SourceGraphic" in2="gb" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes mainPulse {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes auditFlicker {
      0%, 40% { fill: #ef4444; stroke: #f87171; }
      45%, 100% { fill: #22c55e; stroke: #4ade80; }
    }
    @keyframes auditTextFlicker {
      0%, 40% { opacity: 1; }
      41%, 44% { opacity: 0; }
      45%, 100% { opacity: 1; }
    }
    .flow-dot-top {
      offset-path: path("M 80 190 L 190 190 L 320 120 L 460 120 L 590 120 L 730 190 L 850 190");
      animation: mainPulse 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .flow-dot-bot {
      offset-path: path("M 80 190 L 190 190 L 320 260 L 460 260 L 590 260 L 730 190 L 850 190");
      animation: mainPulse 8s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.5s;
    }
    .audit-box { animation: auditFlicker 8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .flow-dot-top, .flow-dot-bot, .audit-box { animation: none !important; }
    }
  </style>

  <rect width="940" height="380" rx="14" fill="url(#flowBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="44" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" letter-spacing="1">
    HEXMIND CORE EXECUTION FLOW
  </text>
  <text x="40" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    User prompt → Dynamic DAG planning → Parallel execution with Runner-Up Auditor loops → Unified synthesis
  </text>

  <!-- Connecting Lines -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <!-- User to Lead -->
    <path d="M 120 190 L 170 190"/>
    <!-- Lead to Branches -->
    <path d="M 270 190 C 290 190, 290 120, 320 120"/>
    <path d="M 270 190 C 290 190, 290 260, 320 260"/>
    <!-- Top Branch: Exec to Audit to Synth -->
    <path d="M 430 120 L 480 120"/>
    <path d="M 590 120 C 650 120, 670 190, 710 190"/>
    <!-- Bot Branch: Exec to Audit to Synth -->
    <path d="M 430 260 L 480 260"/>
    <path d="M 590 260 C 650 260, 670 190, 710 190"/>
    <!-- Synth to User -->
    <path d="M 810 190 L 860 190"/>
  </g>

  <!-- 1. USER INPUT NODE (X=40, Y=160) -->
  <g transform="translate(40, 160)">
    <rect width="80" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="40" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9" text-anchor="middle">USER</text>
    <text x="40" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Prompt</text>
  </g>

  <!-- 2. LEAD PLANNING NODE (X=170, Y=150) -->
  <g transform="translate(170, 150)" filter="url(#fGlow)">
    <rect width="100" height="80" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e9d5ff" text-anchor="middle">LEAD AGENT</text>
    <text x="50" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" text-anchor="middle">JSON Plan</text>
    <text x="50" y="64" font-family="ui-monospace, monospace" font-size="9" fill="#a855f7" text-anchor="middle">DAG + Roster</text>
  </g>

  <!-- 3. TOP PARALLEL TASK: Task 1 (Gemini) + Audit (Claude) -->
  <!-- Primary Task -->
  <g transform="translate(320, 90)">
    <rect width="110" height="60" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle">Task 1: Recon</text>
    <text x="55" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Gemini (agy)</text>
  </g>
  <!-- Auditor -->
  <g transform="translate(480, 85)">
    <rect width="110" height="70" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="55" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">Runner-Up</text>
    <text x="55" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" text-anchor="middle">Claude Audit</text>
    <!-- Status Badge -->
    <rect x="20" y="48" width="70" height="16" rx="8" fill="#064e3b" stroke="#22c55e" stroke-width="1"/>
    <text x="55" y="60" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle">PASS (r0)</text>
  </g>

  <!-- 4. BOTTOM PARALLEL TASK: Task 2 (Claude) + Audit (Codex) -->
  <!-- Primary Task -->
  <g transform="translate(320, 230)">
    <rect width="110" height="60" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="55" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">Task 2: Refactor</text>
    <text x="55" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#a855f7" text-anchor="middle">Claude</text>
  </g>
  <!-- Auditor -->
  <g transform="translate(480, 225)">
    <rect width="110" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="55" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Runner-Up</text>
    <text x="55" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#34d399" text-anchor="middle">Codex Audit</text>
    <!-- Status Badge with Animated Fix -->
    <rect x="18" y="48" width="74" height="16" rx="8" class="audit-box" stroke-width="1"/>
    <text x="55" y="60" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">FIXED (r1)</text>
  </g>

  <!-- 5. SYNTHESIS NODE (X=710, Y=150) -->
  <g transform="translate(710, 150)" filter="url(#fGlow)">
    <polygon points="50,0 100,40 100,40 50,80 0,40" fill="#1e1b4b" stroke="#ec4899" stroke-width="2"/>
    <text x="50" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fdf2f8" text-anchor="middle">SYNTHESIS</text>
    <text x="50" y="52" font-family="ui-monospace, monospace" font-size="9" fill="#f472b6" text-anchor="middle">Lead Summary</text>
  </g>

  <!-- 6. FINAL RESULT (X=860, Y=160) -->
  <g transform="translate(860, 160)">
    <rect width="60" height="60" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="30" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bbf7d0" text-anchor="middle">DONE</text>
    <text x="30" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#86efac" text-anchor="middle">Reply</text>
  </g>

  <!-- Animated Flying Pulses -->
  <circle class="flow-dot-top" r="5" fill="#38bdf8" filter="url(#fGlow)"/>
  <circle class="flow-dot-bot" r="5" fill="#a855f7" filter="url(#fGlow)"/>
</svg>
