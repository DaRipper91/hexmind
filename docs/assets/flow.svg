<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="gb"/>
      <feComposite in="SourceGraphic" in2="gb" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes mainPulse {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes auditFlicker {
      0%, 40% { fill: #ef4444; stroke: #f87171; }
      45%, 100% { fill: #22c55e; stroke: #4ade80; }
    }
    @keyframes auditTextFlicker {
      0%, 40% { opacity: 1; } 41%, 44% { opacity: 0; } 45%, 100% { opacity: 1; }
    }
    @keyframes registryFlow {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes gateBlink {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #fbbf24); }
    }
    .flow-dot-top {
      offset-path: path("M 132 214 L 216 214 L 300 158 L 452 158 L 604 158 L 742 214 L 872 214");
      animation: mainPulse 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .flow-dot-bot {
      offset-path: path("M 132 214 L 216 214 L 300 288 L 452 288 L 604 288 L 742 214 L 872 214");
      animation: mainPulse 8s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.5s;
    }
    .flow-dot-reg {
      offset-path: path("M 120 452 L 300 452 L 420 400 L 596 400 L 700 300");
      animation: registryFlow 7s linear infinite;
    }
    .audit-box { animation: auditFlicker 8s ease-in-out infinite; }
    .audit-text { animation: auditTextFlicker 8s ease-in-out infinite; }
    .gate { animation: gateBlink 3.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .flow-dot-top, .flow-dot-bot, .flow-dot-reg, .audit-box, .audit-text, .gate {
        animation: none !important;
      }
    }
  </style>

  <rect width="1000" height="520" rx="14" fill="url(#flowBg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="40" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" letter-spacing="1">
    HEXMIND CORE EXECUTION FLOW
  </text>
  <text x="40" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Registry-driven roster → lead plans a DAG → parallel tasks with runner-up audit, gates and escalation → synthesis
  </text>

  <!-- Wires -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M 132 214 L 168 214"/>
    <path d="M 296 214 C 316 214, 316 158, 340 158"/>
    <path d="M 296 214 C 316 214, 316 288, 340 288"/>
    <path d="M 460 158 L 500 158"/>
    <path d="M 620 158 C 690 158, 700 214, 726 214"/>
    <path d="M 460 288 L 500 288"/>
    <path d="M 620 288 C 690 288, 700 214, 726 214"/>
    <path d="M 806 214 L 856 214"/>
    <!-- registry into the lead -->
    <path d="M 200 424 L 200 380 L 240 380 L 240 250" stroke-dasharray="5 4"/>
  </g>

  <!-- 0. REGISTRY (the roster's only source of truth) -->
  <g transform="translate(60, 424)">
    <rect width="200" height="52" rx="9" fill="#0c0a1f" stroke="url(#neonPurple)" stroke-width="1.6"/>
    <text x="100" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">models.toml → registry</text>
    <text x="100" y="39" font-family="ui-monospace, monospace" font-size="9.5" fill="#a855f7" text-anchor="middle">best_at · avoid_for · domains</text>
  </g>
  <circle class="flow-dot-reg" r="4" fill="#a855f7" filter="url(#fGlow)"/>

  <!-- 1. USER -->
  <g transform="translate(52, 184)">
    <rect width="80" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="40" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9" text-anchor="middle">YOU</text>
    <text x="40" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Prompt</text>
  </g>

  <!-- 2. LEAD -->
  <g transform="translate(168, 174)" filter="url(#fGlow)">
    <rect width="128" height="80" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="64" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e9d5ff" text-anchor="middle">LEAD</text>
    <text x="64" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" text-anchor="middle">you chose it</text>
    <text x="64" y="56" font-family="ui-monospace, monospace" font-size="9" fill="#a855f7" text-anchor="middle">JSON plan: DAG</text>
    <text x="64" y="69" font-family="ui-monospace, monospace" font-size="9" fill="#a855f7" text-anchor="middle">+ domain + gate</text>
  </g>

  <!-- 3. TOP TASK -->
  <g transform="translate(340, 128)">
    <rect width="120" height="60" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle">Task 1 · recon</text>
    <text x="60" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">any member</text>
  </g>
  <g transform="translate(500, 123)">
    <rect width="120" height="70" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="60" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">Runner-Up</text>
    <text x="60" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" text-anchor="middle">audits it</text>
    <rect x="18" y="48" width="84" height="16" rx="8" class="audit-box" stroke-width="1"/>
    <text x="60" y="60" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ffffff" class="audit-text" text-anchor="middle">FIXED (r1)</text>
  </g>

  <!-- 4. BOTTOM TASK -->
  <g transform="translate(340, 258)">
    <rect width="120" height="60" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="60" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">Task 2 · refactor</text>
    <text x="60" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#a855f7" text-anchor="middle">in parallel</text>
  </g>
  <g transform="translate(500, 253)">
    <rect width="120" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Runner-Up</text>
    <text x="60" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#34d399" text-anchor="middle">audits it</text>
    <rect x="22" y="48" width="76" height="16" rx="8" fill="#064e3b" stroke="#22c55e" stroke-width="1"/>
    <text x="60" y="60" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle">PASS (r0)</text>
  </g>

  <!-- 5. GATE + ESCALATION (what the audit verdict actually decides) -->
  <g transform="translate(660, 330)">
    <rect width="150" height="86" rx="9" fill="#1c1408" stroke="url(#neonAmber)" stroke-width="1.6" class="gate"/>
    <text x="75" y="20" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fde68a" text-anchor="middle">IF STILL FAILING</text>
    <line x1="14" y1="28" x2="136" y2="28" stroke="#78350f" stroke-width="1"/>
    <text x="75" y="45" font-family="ui-monospace, monospace" font-size="9.5" fill="#fbbf24" text-anchor="middle">gate: true → fail,</text>
    <text x="75" y="58" font-family="ui-monospace, monospace" font-size="9.5" fill="#fbbf24" text-anchor="middle">dependents skipped</text>
    <text x="75" y="73" font-family="ui-monospace, monospace" font-size="9.5" fill="#fdba74" text-anchor="middle">else → ESCALATION</text>
  </g>
  <path d="M 620 300 C 640 300, 640 340, 660 356" stroke="#78350f" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>

  <!-- 6. SYNTHESIS -->
  <g transform="translate(726, 174)" filter="url(#fGlow)">
    <polygon points="40,0 80,40 80,40 40,80 0,40" fill="#1e1b4b" stroke="#ec4899" stroke-width="2"/>
    <text x="40" y="36" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#fdf2f8" text-anchor="middle">SYNTHESIS</text>
    <text x="40" y="52" font-family="ui-monospace, monospace" font-size="8.5" fill="#f472b6" text-anchor="middle">+ statuses</text>
  </g>

  <!-- 7. RESULT -->
  <g transform="translate(856, 184)">
    <rect width="96" height="60" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="48" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bbf7d0" text-anchor="middle">DONE</text>
    <text x="48" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#86efac" text-anchor="middle">One answer</text>
  </g>

  <circle class="flow-dot-top" r="5" fill="#38bdf8" filter="url(#fGlow)"/>
  <circle class="flow-dot-bot" r="5" fill="#a855f7" filter="url(#fGlow)"/>

  <text x="40" y="500" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">
    A failure is never silent: a gated stage fails loudly, an ungated one escalates with both sides of the argument.
  </text>
</svg>
