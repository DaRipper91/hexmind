<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="100%" height="6">
  <defs>
    <linearGradient id="baseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDiv" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes sweep {
      0% { transform: translateX(-300px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    .shimmer-pulse {
      animation: sweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .shimmer-pulse { animation: none !important; opacity: 0 !important; }
    }
  </style>
  <rect x="0" y="2" width="900" height="2" fill="url(#baseLine)" rx="1"/>
  <rect class="shimmer-pulse" x="0" y="1" width="260" height="4" fill="url(#shimmer)" filter="url(#glowDiv)" rx="2"/>
</svg>
