<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseHex {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
      50% { transform: scale(1.05) rotate(3deg); opacity: 1; filter: drop-shadow(0 0 12px #a855f7); }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(48px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(48px) rotate(-360deg); }
    }
    @keyframes scanLine {
      0% { transform: translateX(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    .hex-core {
      transform-origin: 120px 120px;
      animation: pulseHex 6s ease-in-out infinite;
    }
    .orbit-1 { transform-origin: 120px 120px; animation: orbitNode 8s linear infinite; }
    .orbit-2 { transform-origin: 120px 120px; animation: orbitNode 12s linear infinite reverse; }
    .orbit-3 { transform-origin: 120px 120px; animation: orbitNode 16s linear infinite; }
    .tierGlow { animation: tierPulse 5s ease-in-out infinite; transform-origin: 590px 189px; }
    @keyframes tierPulse {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #a855f7); }
    }
    .scan-bar { animation: scanLine 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .hex-core, .orbit-1, .orbit-2, .orbit-3, .tierGlow, .scan-bar { animation: none !important; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Background Circuit Grid Lines -->
  <g stroke="#374151" stroke-width="0.7" stroke-dasharray="3 6" opacity="0.35">
    <line x1="40" y1="40" x2="860" y2="40"/>
    <line x1="40" y1="120" x2="860" y2="120"/>
    <line x1="40" y1="200" x2="860" y2="200"/>
    <line x1="240" y1="20" x2="240" y2="220"/>
    <line x1="560" y1="20" x2="560" y2="220"/>
  </g>

  <!-- Hexagon Core Emblem -->
  <g class="hex-core" filter="url(#glow)">
    <!-- Outer Hexagon -->
    <polygon points="120,60 168,88 168,144 120,172 72,144 72,88" 
             fill="none" stroke="url(#hexGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Inner Concentric Hexagon -->
    <polygon points="120,76 154,96 154,136 120,156 86,136 86,96" 
             fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.9"/>
    <!-- Center Core Node -->
    <circle cx="120" cy="120" r="10" fill="url(#hexGrad)" filter="url(#softGlow)"/>
    <circle cx="120" cy="120" r="4" fill="#ffffff"/>
  </g>

  <!-- Orbiting Model Nodes -->
  <g class="orbit-1">
    <circle cx="120" cy="120" r="5" fill="#a855f7" filter="url(#softGlow)"/>
  </g>
  <g class="orbit-2">
    <circle cx="120" cy="120" r="4.5" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>
  <g class="orbit-3">
    <circle cx="120" cy="120" r="3.5" fill="#ec4899" filter="url(#softGlow)"/>
  </g>

  <!-- Typography & Wordmark -->
  <g transform="translate(230, 0)">
    <!-- Brand Title -->
    <text x="0" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" font-size="56" letter-spacing="4" fill="url(#textGrad)" filter="url(#softGlow)">
      HEXMIND
    </text>

    <!-- Version Badge -->
    <g transform="translate(320, 72)">
      <rect width="58" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="29" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="700" 
            fill="#a5b4fc" text-anchor="middle">v0.1</text>
    </g>

    <!-- Tagline -->
    <text x="2" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="500" font-size="19" letter-spacing="1.5" fill="#94a3b8">
      Many models. <tspan fill="#38bdf8">One room.</tspan> One <tspan fill="#c084fc">lead</tspan> you pick.
    </text>

    <!-- Model Mesh Pills: the vendor CLIs, then the free opencode tier as one pill -->
    <g transform="translate(2, 176)">
      <!-- Claude -->
      <rect x="0" y="0" width="86" height="26" rx="13" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#c084fc"/>
      <text x="26" y="17" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#e9d5ff">Claude</text>

      <!-- Gemini (agy) -->
      <rect x="92" y="0" width="116" height="26" rx="13" fill="#082f49" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="106" cy="13" r="4" fill="#38bdf8"/>
      <text x="118" y="17" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#bae6fd">Gemini</text>

      <!-- Codex -->
      <rect x="214" y="0" width="86" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <circle cx="228" cy="13" r="4" fill="#34d399"/>
      <text x="240" y="17" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#a7f3d0">Codex</text>

      <!-- Copilot -->
      <rect x="306" y="0" width="98" height="26" rx="13" fill="#111827" stroke="#6b7280" stroke-width="1"/>
      <circle cx="320" cy="13" r="4" fill="#9ca3af"/>
      <text x="332" y="17" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#e5e7eb">Copilot</text>

      <!-- Kimi -->
      <rect x="410" y="0" width="80" height="26" rx="13" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <circle cx="424" cy="13" r="4" fill="#f87171"/>
      <text x="436" y="17" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#fecaca">Kimi</text>

      <!-- the free opencode tier, as one pill with its own glow -->
      <g class="tierGlow">
        <rect x="496" y="0" width="188" height="26" rx="13" fill="#0c0a1f" stroke="url(#hexGrad)" stroke-width="1.2"/>
        <circle cx="510" cy="13" r="4" fill="#a855f7"/>
        <circle cx="519" cy="13" r="3" fill="#38bdf8"/>
        <text x="530" y="17" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#e9d5ff">8 free opencode models</text>
      </g>

      <!-- local, opt-in -->
      <rect x="690" y="0" width="128" height="26" rx="13" fill="#1c1917" stroke="#78716c" stroke-width="1" stroke-dasharray="3 2"/>
      <circle cx="704" cy="13" r="4" fill="#a8a29e"/>
      <text x="716" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#d6d3d1">local Ollama</text>
    </g>
  </g>

  <!-- Bottom Animated Gradient Accent Line -->
  <rect x="30" y="237" width="840" height="2" fill="url(#lineGrad)"/>
</svg>
