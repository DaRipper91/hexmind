[project]
name = "hexmind"
version = "0.1.0"
description = "Multi-model agent team (Claude, agy, Codex, Jules) in one chat room"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
# The Qt front-end (hexmind.qt.HexmindWidget) is strictly opt-in: PySide6 is a ~100 MB dependency
# and every Textual TUI user would otherwise be made to install it. Aether embeds the widget via
# its own `room = ["hexmind[qt]"]` extra. See docs/AETHER-INTERFACE.md.
# pyqtgraph draws the stats panel's stacked bars; it is imported behind a try/except so the rest of
# the GUI still works without it (the stats tab degrades to the raw ledger plus an install hint).
# qtawesome and qdarkstyle are the icon set and the base theme, likewise optional at import time.
qt = ["PySide6>=6.5", "pyqtgraph>=0.13", "numpy>=1.26", "qtawesome>=1.3", "qdarkstyle>=3.2"]
# `--serve` is a shipped surface (README documents the REST + WebSocket API) and server.py imports
# fastapi and pydantic at module level. Declaring neither meant a clean `pip install hexmind` gave
# you a broken --serve, with a ModuleNotFoundError traceback out of the argument parser. Same
# opt-in shape as `qt`, and the same floor as agentdeck's `web` extra.
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
# Development and test only. `httpx2` is what starlette's TestClient needs, and tests/test_server.py
# uses it; pytest was previously assumed to be ambient, which is why a fresh .venv could not run the
# suite at all. Nothing here belongs in a user's install.
dev = ["pytest>=8", "httpx2>=2"]

[project.scripts]
hexmind = "hexmind.__main__:main"
# The standalone window. Same widget, same orchestrator; the only difference is that main() owns the
# QApplication and applies theme.stylesheet() app-wide, which an embedded widget must never do.
hexmind-gui = "hexmind.qt.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, so a new subpackage is a deliberate line here. `hexmind.qt` was silently left out of a
# wheel once already: it works perfectly from the editable .venv and fails on a clean install, which
# is the worst way for a packaging gap to show up.
packages = ["hexmind", "hexmind.qt"]

[tool.setuptools.package-data]
hexmind = ["chains/*.toml", "hexmind.svg", "models.toml"]
