avoid_for = "anything needing command execution or test runs"
domains = ["implementation", "shell", "general"]
cli = "copilot"
verify = "path"
tier = "cloud"
weight = 40
color = "white"
footprint = "cloud · edits only, no shell"

[models.jules]
label = "Google Jules"
best_at = "long-running self-contained coding tasks that come back as a pull request against the GitHub copy of the repo"
avoid_for = "local or uncommitted work — it never sees your working tree; give it only code that is already pushed"
domains = ["implementation", "refactor", "docs"]
cli = "jules"
verify = "env"
env = "JULES_API_KEY"
opt_in = true
text_only = true
tier = "cloud"
weight = 30
color = "magenta"
footprint = "cloud · minutes to hours, returns a PR"

[models.qwen]
label = "local qwen2.5-coder:7b via Ollama"
best_at = "small self-contained text jobs — summarize, classify, triage, draft short text"
avoid_for = "files and tools entirely: it is text-only, so paste in everything it needs"
domains = ["docs", "general"]
cli = "ollama"
model = "qwen2.5-coder:7b"
verify = "ollama"
tier = "local"
opt_in = true
text_only = true
weight = 20
color = "yellow"
footprint = "local · shares one Ollama slot with qwen-large"

[models.qwen-large]
label = "local qwen2.5-coder:latest via Ollama"
best_at = "the same text-only work as qwen but on the larger build — slower, better when qwen would struggle"
avoid_for = "files and tools entirely; evicting qwen to load this one is a real cost"
domains = ["implementation", "research", "docs"]
cli = "ollama"
model = "qwen2.5-coder:latest"
verify = "ollama"
tier = "local"
opt_in = true
text_only = true
weight = 20
color = "gold1"
footprint = "local · shares one Ollama slot with qwen"

[models.kimi]
label = "Moonshot AI Kimi Code"
best_at = "1M-token context with deep extended thinking — general implementation and second opinions on large-context tasks"
avoid_for = "very large prompts: it takes the prompt as an argv token, so it can hit the OS arg-length limit"
domains = ["research", "implementation", "architecture"]
cli = "kimi"
verify = "path"
tier = "cloud"
weight = 50
color = "red"
footprint = "cloud · 1M context"
variant = "max"
