# Hexmind model registry. The single source of truth for who is on the team and what each model is
# for. The lead's roster prompt is GENERATED from these fields (see models.py: Model.description),
# so a model cannot be described one way in the room and another way in /models.
#
# Override any subset for your own machine at ~/.config/hexmind/models.toml (same table names).
# That file wins, exactly as ~/.config/hexmind/chains/ wins over the bundled chains.
#
# Fields
#   label        display name + vendor, shown to the lead and the user
#   best_at      what to give this model. This is the routing signal.
#   avoid_for    what NOT to give it. Prevents the misuse the report warns about.
#   domains      auditor.DOMAINS values this model is strong in; drives ranking and assignment
#   verify       how availability is checked: path | ollama | env
#   weight       preference, higher wins ties. opencode models are favoured (plan R5).
#   think        per-model reasoning-trace flag (replaces the hardcoded think:false in backends.py)
#   variant      provider-specific reasoning effort, where the CLI accepts one
#   opt_in       only joins with --with NAME
#   text_only    cannot see local files: never leads, never audits, skipped by relay rotation
#   tier         cloud | local
#   model        for cloud: provider/model id. for local: the exact Ollama tag from /api/tags.

[models.claude]
label = "Claude Code"
best_at = "careful multi-file code changes, refactoring, code review, debugging, planning, writing docs"
domains = ["architecture", "implementation", "refactor", "review", "debugging", "docs", "tests"]
cli = "claude"
verify = "path"
tier = "cloud"
weight = 60
color = "orange1"
footprint = "cloud · careful and thorough"

[models.agy]
label = "Google Gemini"
best_at = "very large context reading, deep reasoning, polyglot code generation, web research, UI/frontend work"
domains = ["research", "ui", "implementation", "architecture"]
cli = "agy"
verify = "path"
tier = "cloud"
weight = 60
color = "cyan"
footprint = "cloud · large context"

[models.codex]
label = "OpenAI Codex"
best_at = "fast focused implementation, writing tests, shell scripting and automation"
domains = ["implementation", "tests", "shell"]
cli = "codex"
verify = "path"
tier = "cloud"
weight = 60
color = "green"
footprint = "cloud · fast and focused"

# ── free OpenCode Zen models: all eight verified present in `opencode models` on 2026-09-27 ──

[models.opencode]
label = "NVIDIA Nemotron 3.5 Lightning (Free)"
best_at = "sub-second atomic work — unit tests, lint fixes, Conventional Commits, CI triage"
avoid_for = "multi-module design; keep each prompt to one function or one failing test"
domains = ["tests", "refactor", "shell", "docs"]
cli = "opencode"
model = "opencode/nemotron-3.5-lightning-free"
verify = "path"
tier = "cloud"
weight = 100
color = "bright_blue"
footprint = "cloud · sub-second"
variant = "minimal"

